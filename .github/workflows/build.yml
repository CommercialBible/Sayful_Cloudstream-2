name: Build Extensions

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-

      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all extensions
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare .cs3 files
        run: |
          mkdir -p artifacts
          for module in MoviesShowsPlugin AnimePlugin MangaPlugin; do
            apk=$(find "$module/build/outputs/apk/release" -name "*.apk" -type f | head -1)
            if [ -n "$apk" ]; then
              base=$(basename "$apk" .apk)
              cp "$apk" "artifacts/${base}.cs3"
            fi
          done

      - name: Generate build info
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > artifacts/build_info.txt
          echo "COMMIT_SHA=${{ github.sha }}" >> artifacts/build_info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs3-extensions
          path: artifacts/*.cs3
          retention-days: 30

      - name: Commit to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B builds
          mkdir -p builds
          cp artifacts/*.cs3 builds/
          cp plugins.json builds/
          cp repo.json builds/
          git add builds/
          git commit -m "Build extensions from ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds --force
